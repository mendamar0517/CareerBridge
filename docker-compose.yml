# CareerBridge — локал хөгжүүлэлтийн орчин
# Ажиллуулах: docker compose up -d --build
#   Веб + API:  http://localhost:3000          (health: /health, metrics: /metrics)
#   Демо бүртгэл (db/init/02_seed.sql): seeker@careerbridge.test / employer@careerbridge.test, нууц үг Demo1234
#   Prometheus: http://localhost:9090          (Лаб 13)
#   Grafana:    http://localhost:3001          (Лаб 13, admin / admin)
services:
  api:
    build: .
    image: careerbridge-api:local
    container_name: careerbridge-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # JWT гарын үсгийн түлхүүр — локалд анхдагч утга, production-д заавал солино
      JWT_SECRET: ${JWT_SECRET:-careerbridge-local-dev-secret}
      # Контейнер дотроос DB-д "db" нэрээр хандана (localhost биш)
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerbridge}:${POSTGRES_PASSWORD:-careerbridge}@db:5432/${POSTGRES_DB:-careerbridge}?schema=public
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: careerbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerbridge}
      POSTGRES_DB: ${POSTGRES_DB:-careerbridge}
      TZ: Asia/Ulaanbaatar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cb-pgdata:/var/lib/postgresql/data
      # Volume хоосон үед (анх удаа) db/init/*.sql файлуудыг цагаан толгойн дарааллаар ажиллуулна
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Лаб 13: хяналт (monitoring) ----------
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: careerbridge-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - cb-prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.0
    container_name: careerbridge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Нэвтрэлгүйгээр dashboard харах (зөвхөн уншина) — локал лабд зориулав
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/careerbridge-api.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cb-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  cb-pgdata:
  cb-prometheus:
  cb-grafana:
