# Dependabot — хамаарлын шинэчлэл, эмзэг байдлын засварыг автоматаар PR болгон санал болгоно (Лаб 11)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 5
    groups:
      dev-tooling:                 # ESLint, Jest-ийн шинэчлэлийг нэг PR болгоно
        dependency-type: development
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: npm         # React frontend (web/)
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 5
    groups:
      react:                       # react, react-dom-ийн хувилбар заавал ижил (peer) → нэг PR
        patterns: [react, react-dom]
      web-tooling:
        dependency-type: development
    ignore:
      # Tailwind 4 нь тохиргоо, CSS-ийн бүтцийг өөрчилдөг (PostCSS plugin тусдаа package болсон).
      # Шилжилтийг тусдаа ажлаар хийнэ; patch/minor шинэчлэл ирсээр байна.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
    labels: [dependencies, frontend]
