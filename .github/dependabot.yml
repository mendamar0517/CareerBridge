# Dependabot — хамаарлын шинэчлэл, эмзэг байдлын засварыг автоматаар PR болгон санал болгоно (Лаб 11)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 5
    groups:
      dev-tooling:                 # ESLint, Jest-ийн шинэчлэлийг нэг PR болгоно
        dependency-type: development
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
