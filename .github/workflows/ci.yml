name: CareerBridge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Нэг салбар дээр шинэ push ирэхэд өмнөх, дуусаагүй ажлыг цуцална
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. CI — тест (Лаб 07)
  # ---------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    # Integration тестэд зориулсан PostgreSQL 16 (docker-compose-той ижил хувилбар)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerbridge
          POSTGRES_PASSWORD: careerbridge
          POSTGRES_DB: careerbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerbridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://careerbridge:careerbridge@localhost:5432/careerbridge

    steps:
      # 1. Checkout – repo-гийн кодыг runner руу татах
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup – Node.js орчин тохируулах
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install – хамаарал суулгах
      - name: Install dependencies
        run: npm ci

      # 4. DB схем ачаалах (db/init/01_schema.sql: 18 хүснэгт, 2 view)
      - name: Load database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/init/01_schema.sql

      # 5. Test – unit, API болон PostgreSQL integration тест
      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # 2. Docker image build → smoke test → GHCR руу push
  #    PR дээр: зөвхөн build + smoke test (push хийхгүй)
  #    main руу push хийхэд: build + smoke test + push
  # ---------------------------------------------------------------
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io руу push хийх эрх (GITHUB_TOKEN)

    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # arm64 (Apple Silicon Mac, ARM сервер) image-ийг amd64 runner дээр build хийх эмуляц
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image-ийн нэр, tag: ghcr.io/<owner>/<repo>:sha-xxxxxxx, :latest
      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Image-ийг build хийж runner дээр ачаалах (push хийхээс өмнө шалгах)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: careerbridge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Контейнерийг асааж /health endpoint хариу өгч байгааг шалгах
      - name: Smoke test (/health)
        run: |
          docker run -d --name cb-smoke -p 3000:3000 careerbridge-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Smoke test амжилттай"; exit 0
            fi
            sleep 2
          done
          echo "Smoke test амжилтгүй"; docker logs cb-smoke; exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f cb-smoke || true

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 multi-arch image (manifest list) болгон push хийнэ.
      # amd64 хэсэг нь cache-ээс дахин ашиглагдана.
      - name: Push image to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.PUSH_IMAGE == 'true'
        run: |
          echo "### Docker image push хийгдлээ" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
