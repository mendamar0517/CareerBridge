name: CareerBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout – repo-гийн кодыг runner руу татах
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup – Node.js орчин тохируулах
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install – хамаарал суулгах
      - name: Install dependencies
        run: npm ci

      # 4. Test – unit тест ажиллуулах
      - name: Run tests
        run: npm test
