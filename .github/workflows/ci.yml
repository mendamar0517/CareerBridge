name: CareerBridge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Нэг салбар дээр шинэ push ирэхэд өмнөх, дуусаагүй ажлыг цуцална
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. CI — тест (Лаб 07)
  # ---------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    # Integration тестэд зориулсан PostgreSQL 16 (docker-compose-той ижил хувилбар)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerbridge
          POSTGRES_PASSWORD: careerbridge
          POSTGRES_DB: careerbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerbridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://careerbridge:careerbridge@localhost:5432/careerbridge

    steps:
      # 1. Checkout – repo-гийн кодыг runner руу татах
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup – Node.js орчин тохируулах
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 3. Install – хамаарал суулгах
      - name: Install dependencies
        run: npm ci

      # Лаб 11: статик шинжилгээ (ESLint + security + sonarjs + n)
      - name: Lint (ESLint)
        run: npm run lint

      # Лаб 11: production хамаарал High/Critical эмзэг байдалгүй байх ёстой (image-д ордог)
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Бүх хамаарал (dev орно): Critical байвал унана, бусдыг summary-д тайлагнана
      - name: npm audit (all dependencies)
        run: |
          npm audit --json > audit.json || true
          node -e '
            const m = require("./audit.json").metadata.vulnerabilities;
            console.log(["### npm audit", "| Critical | High | Moderate | Low | Нийт |", "|---|---|---|---|---|",
              `| ${m.critical} | ${m.high} | ${m.moderate} | ${m.low} | ${m.total} |`].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=critical

      # 4. DB схем ачаалах (db/init/01_schema.sql: 18 хүснэгт, 2 view)
      - name: Load database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/init/01_schema.sql

      # 5. Test – unit, API, mock болон PostgreSQL integration тест + coverage (босго 80%)
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Test coverage", "| Хэмжүүр | % | Хамрагдсан |", "|---|---|---|",
                ...["lines", "branches", "functions", "statements"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ---------------------------------------------------------------
  # 2. Docker image build → smoke test → GHCR руу push
  #    PR дээр: зөвхөн build + smoke test (push хийхгүй)
  #    main руу push хийхэд: build + smoke test + push
  # ---------------------------------------------------------------
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io руу push хийх эрх (GITHUB_TOKEN)

    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # arm64 (Apple Silicon Mac, ARM сервер) image-ийг amd64 runner дээр build хийх эмуляц
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image-ийн нэр, tag: ghcr.io/<owner>/<repo>:sha-xxxxxxx, :latest
      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Image-ийг build хийж runner дээр ачаалах (push хийхээс өмнө шалгах)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: careerbridge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Контейнерийг асааж /health endpoint хариу өгч байгааг шалгах
      - name: Smoke test (/health)
        run: |
          docker run -d --name cb-smoke -p 3000:3000 careerbridge-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Smoke test амжилттай"; exit 0
            fi
            sleep 2
          done
          echo "Smoke test амжилтгүй"; docker logs cb-smoke; exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f cb-smoke || true

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 multi-arch image (manifest list) болгон push хийнэ.
      # amd64 хэсэг нь cache-ээс дахин ашиглагдана.
      - name: Push image to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.PUSH_IMAGE == 'true'
        run: |
          echo "### Docker image push хийгдлээ" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # 3. Kubernetes (Лаб 09) — kind cluster дээр k8s/ manifest-уудыг шалгах
  #    Deployment 3/3 Ready → Service-ээр хандах → Pod устгаж self-healing
  # ---------------------------------------------------------------
  k8s:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifests (kubeconform)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 /k8s

      # Энэ commit-ийн кодоор image бүтээж cluster-т ачаална (GHCR-ээс татахгүй)
      - name: Build image
        run: docker build -t careerbridge-api:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lab09

      - name: Load image into cluster
        run: kind load docker-image careerbridge-api:ci --name lab09

      - name: Apply Deployment and Service
        run: |
          kubectl apply -f k8s/
          # CI дээр локал image ашиглах (manifest нь GHCR-ийн :latest-ийг заадаг)
          kubectl patch deployment careerbridge-api --type=json -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"careerbridge-api:ci"},
            {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]'
          kubectl rollout status deployment/careerbridge-api --timeout=120s

      - name: Check 3 Pods are Ready
        run: |
          kubectl get deployment,pods,service -l app=careerbridge-api -o wide
          ready=$(kubectl get deployment careerbridge-api -o jsonpath='{.status.readyReplicas}')
          echo "Ready replicas: $ready"
          test "$ready" = "3"

      # Minikube-ийн `minikube service`-тэй адил: node-ийн IP:30080 (NodePort) → kube-proxy → 3 Pod
      - name: Access API through Service (NodePort 30080)
        run: |
          node_ip=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          url="http://$node_ip:30080/health"
          echo "Service URL: $url"
          for i in $(seq 1 15); do curl -fsS "$url" && break; sleep 2; done
          echo
          echo "10 хүсэлтийг хариулсан Pod (instance):"
          for i in $(seq 1 10); do curl -fsS "$url" | sed 's/.*"instance":"\([^"]*\)".*/\1/'; done | sort | uniq -c

      - name: Self-healing — delete a Pod
        run: |
          victim=$(kubectl get pods -l app=careerbridge-api -o jsonpath='{.items[0].metadata.name}')
          echo "Устгах Pod: $victim"
          kubectl delete pod "$victim" --wait=false
          for i in $(seq 1 30); do
            ready=$(kubectl get deployment careerbridge-api -o jsonpath='{.status.readyReplicas}')
            if [ "$ready" = "3" ] && ! kubectl get pod "$victim" >/dev/null 2>&1; then
              echo "Self-healing амжилттай: шинэ Pod үүсэж 3/3 Ready"
              kubectl get pods -l app=careerbridge-api
              exit 0
            fi
            sleep 2
          done
          echo "Self-healing амжилтгүй"; kubectl get pods -l app=careerbridge-api; kubectl get events --sort-by=.lastTimestamp | tail -20; exit 1
